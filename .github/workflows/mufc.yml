name: Man United result

on:
  schedule:
    - cron: '17 * * * *'   # hourly; only commits when the latest result actually changes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/mufc.mjs
      - name: Commit if changed
        run: |
          git add mufc.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Man United result"
          git push
